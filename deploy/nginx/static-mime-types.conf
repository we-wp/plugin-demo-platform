# Complete MIME map for the selected Playground runtime and first-party shell.
# Include this inside every explicit static-file location. A location-level
# `types` block replaces inherited mappings, so a wasm-only block also turns
# JavaScript and CSS into application/octet-stream.
types {
    application/javascript                js;
    application/json                      json;
    application/vnd.ms-fontobject         eot;
    application/wasm                      wasm;
    application/x-x509-ca-cert            crt;
    application/zip                       zip;
    application/zstd                      zst;
    font/ttf                              ttf;
    font/woff                             woff;
    font/woff2                            woff2;
    image/gif                             gif;
    image/jpeg                            jpeg jpg;
    image/png                             png;
    image/svg+xml                         svg;
    image/vnd.microsoft.icon              ico;
    image/webp                            webp;
    text/css                              css;
    text/html                             html;
    text/markdown                         md;
    text/plain                            htaccess txt;
    text/x-scss                           scss;
}

default_type application/octet-stream;
